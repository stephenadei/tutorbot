name: Deploy Tutorbot

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy:
    # PUBLIC repo + self-hosted runner: push/dispatch only, never a fork PR.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, vps]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    # System python3 + per-job venv (the VPS has no setup-python tool cache).
    - name: Install dependencies
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install -q -r requirements.txt
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        
    - name: Run syntax check
      run: |
        echo "Running basic syntax check..."
        python -m py_compile main.py
        python -m py_compile scripts/*.py
        python -m py_compile tests/*.py
        echo "Syntax check passed!"
        
    - name: Run tests
      run: |
        echo "Running test suite..."
        python tests/run_tests.py --category core
        echo "Tests completed!"
        
    - name: Deploy to server
      # Runs on the VPS runner itself (user stephen); same commands the SSH hop ran.
      run: |
          echo "🚀 Starting deployment..."
          
          # Navigate to project directory (canonical path per audit: projects/tutorbot)
          cd /home/stephen/projects/tutorbot
          
          # Pull latest changes
          echo "📥 Pulling latest changes..."
          git pull origin master
          
          # Restart Docker container
          echo "🔄 Restarting Docker container..."
          docker-compose down
          docker-compose up -d
          
          # Wait and check status
          sleep 10
          if docker-compose ps | grep -q "Up"; then
              echo "✅ Tutorbot successfully deployed and running!"
              echo "📊 Container status:"
              docker-compose ps
              echo "📋 Recent logs:"
              docker-compose logs --tail=20
          else
              echo "❌ Failed to start tutorbot container"
              echo "📋 Container logs:"
              docker-compose logs
              exit 1
          fi 